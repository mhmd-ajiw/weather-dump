<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cuaca</title>
</head>

<body>
    <div class="weather-card">
        <h2>Cek Cuaca</h2>
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Masukkan nama kota (misal: Semarang)">
            <button id="search-btn">Cari</button>
        </div>

        <!-- Area hasil ini disembunyikan dulu sampai datanya ada -->
        <div id="weather-result" style="display: none;">
            <h3 id="city-name">Nama Kota</h3>
            <p id="temperature">0°C</p>
            <p id="description">Deskripsi Cuaca</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
